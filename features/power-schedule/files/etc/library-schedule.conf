# ==============================================================================
# Library power schedule
# ==============================================================================

# rtcwake power mode.
#
# Available modes:
#   
#   freeze  - Suspend-to-idle (very light sleep)
#   mem     - Suspend-to-RAM
#   disk    - Hibernate
#   off     - Power off
#
# For normal library computers, "mem" is recommended if supported.
#
# change this line as admin, using:  sudo nano /etc/library-schedule.conf 
mode=mem

# ==============================================================================
# Library opening hours
# ==============================================================================
#
# Format: HH:MM
#
# the variable names must not be changed. the script is made to use english lowercase day initials (line 52).
#
# Leave both values empty when the library is closed that day.

mon_open=08:30
mon_close=14:00

tue_open=08:30
tue_close=14:00

wed_open=08:30
wed_close=14:00

thu_open=08:30
thu_close=14:00

fri_open=
fri_close=

sat_open=
sat_close=

sun_open=
sun_close=