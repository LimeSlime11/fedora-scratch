name: Build Image

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: fedora-scratch
  IMAGE_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/limeslime11/fedora-scratch:latest
            ghcr.io/limeslime11/fedora-scratch:${{ github.sha }}