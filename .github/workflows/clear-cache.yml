name: Clear Build Cache

on:
  workflow_dispatch:

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Clear GitHub Actions caches
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete --all --confirm
        env:
          GH_TOKEN: ${{ github.token }}